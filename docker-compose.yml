# Self-hosted n8n (open source / Community Edition)
# Browser posting runs on your Mac via the local poster service — not inside this container.
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: sarabyx-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODES_EXCLUDE=[]
      # Lets n8n reach the poster service running on your Mac
      - POSTER_BASE_URL=${POSTER_BASE_URL:-http://host.docker.internal:3920}
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./sheet:/data/sheet
      - ./workflows:/data/workflows
      - ./browser/media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
